server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff
    font/woff2;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Vite deja el CSS en /assets/ y el JS en /js/, ambos con hash en el nombre
  location ~ ^/(assets|js)/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|avif|ttf|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
  }

  location ~* \.json$ {
    try_files $uri =404;
    add_header Cache-Control "no-store";
  }

  # Toda página HTML termina aquí (index y fallback de try_files): la CSP solo hace falta en el documento.
  # HSTS, nosniff y Referrer-Policy los pone el nginx del VPS; aquí no se repiten.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
